# Baseline trend-following breakout (spec Part 5). Not active in Milestone 1.
name: trend_breakout_v1
enabled: false
timeframes: {signal: "15", regime: "60", context: "240"}
indicators:
  ema_fast: 50
  ema_slow: 200
  adx_period: 14
  adx_min: 20
  atr_period: 14
  donchian_period: 20
  volume_sma: 20
entry:
  min_reward_risk: 1.8
  target_atr_mult: 3.0         # hypothesis: nominal target for the ex-ante net R:R check (spec defines none)
exit:
  stop_atr_mult: 1.5
  trailing_atr_mult: 2.0       # hypothesis — must be validated in backtest
  max_holding_hours: 72        # hypothesis — must be validated in backtest
